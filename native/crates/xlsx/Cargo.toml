# D3.8 spreadsheet reads. Built on zip + quick-xml (calamine is not in the offline cache).
[package]
name = "dfv-table-xlsx"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
zip = { version = "=3.0.0", default-features = false, features = ["deflate"] }
quick-xml = "=0.38.4"
sha2 = "=0.11.0"

[dev-dependencies]
serde_json = "=1.0.151"
