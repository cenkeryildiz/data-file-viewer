# D3.16 XLSX patch writer (bytes in, bytes out; D3.12 owns publication). Standalone: no path deps.
[package]
name = "dfv-table-xlsx-patch"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
crc32fast = "=1.5.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
regex = "=1.13.1"
sha2 = "=0.11.0"

[dev-dependencies]
serde_json = "=1.0.151"
